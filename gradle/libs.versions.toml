[versions]
kotlin = "2.4.21"
javafx = "25.0.5"
gson = "2.15.0"
httpclient5 = "5.6.5"
httpcore5 = "5.4.4"
junit = "6.1.3"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
httpclient = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
jlink = { id = "org.beryx.jlink", version = "4.2.0" }
